<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTracker">
<meta name="theme-color" content="#0e0e0f">
<title>FitTracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0e0f;--bg2:#161618;--bg3:#1e1e21;--bg4:#252529;--bg5:#2c2c31;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0ede8;--text2:#8a877f;--text3:#5a5753;
  --accent:#c8f060;--accent2:rgba(200,240,96,0.12);
  --blue:#60a8f0;--blue2:rgba(96,168,240,0.12);
  --amber:#f0b860;--amber2:rgba(240,184,96,0.12);
  --red:#f06080;--red2:rgba(240,96,128,0.12);
  --teal:#60e8d8;--teal2:rgba(96,232,216,0.12);
  --radius:14px;--radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

.app-header{padding:calc(var(--safe-top)+14px) 16px 14px;background:var(--bg);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-header h1{font-size:22px;font-weight:700;letter-spacing:-.03em}
.header-sub{font-size:11px;color:var(--text3);margin-top:2px}
.phase-badge{font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.04em}

.page-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h)+var(--safe-bot)+12px)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--border2);display:flex;align-items:stretch;padding-bottom:var(--safe-bot);z-index:200;height:calc(var(--nav-h)+var(--safe-bot))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;min-height:48px;padding:6px 0}
.nav-btn.active{color:var(--accent)}
.nav-icon-wrap{width:38px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-btn.active .nav-icon-wrap{background:var(--accent2)}
.nav-icon{font-size:20px;line-height:1}

/* SESSION TABS */
.sess-tabs{display:flex;gap:8px;padding:12px 16px 8px}
.sess-tab{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:.5px solid var(--border2);background:none;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;text-align:center;transition:all .15s;min-height:44px}
.sess-tab.active-u1{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.sess-tab.active-legs{background:var(--teal2);color:var(--teal);border-color:var(--teal)}
.sess-tab.active-u2{background:var(--amber2);color:var(--amber);border-color:var(--amber)}

/* PHASE BAR */
.phase-bar{display:flex;gap:4px;padding:0 16px 10px}
.phase-seg{flex:1;height:4px;border-radius:2px;opacity:.3}
.phase-seg.active{opacity:1}

/* EXERCISE */
.ex-block{border-bottom:.5px solid var(--border);background:var(--bg3)}
.ex-block:last-child{border-bottom:none}
.ex-header{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 12px;cursor:pointer;min-height:58px}
.ex-left{display:flex;gap:10px;align-items:flex-start;flex:1}
.ex-num{font-size:11px;color:var(--text3);min-width:24px;padding-top:3px;font-weight:600}
.ex-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ex-target{font-size:11px;color:var(--text2);margin-top:4px}
.ex-summary{font-size:11px;color:var(--accent);margin-top:3px;font-weight:500}
.ex-note{font-size:10px;color:var(--amber);background:var(--amber2);border-radius:5px;padding:2px 7px;display:inline-block;margin-top:4px}
.ex-chev{font-size:20px;color:var(--text3);transition:transform .2s;flex-shrink:0;padding-top:2px}

.set-area{display:none;padding:0 16px 16px;background:var(--bg3)}
.set-area.open{display:block}
.set-col-heads{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;margin-bottom:8px}
.set-col-heads span{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set-num{width:28px;height:28px;border-radius:50%;background:var(--bg5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);font-weight:600;flex-shrink:0}
.set-inp{background:var(--bg4);border:.5px solid var(--border);border-radius:9px;padding:9px 6px;font-size:15px;color:var(--text);outline:none;width:100%;text-align:center;min-height:46px;-webkit-appearance:none;font-weight:500;transition:border-color .15s}
.set-inp:focus{border-color:var(--accent)}
.set-inp.has-val{border-color:rgba(200,240,96,.35);color:var(--accent)}
.done-btn{width:40px;height:40px;border-radius:50%;border:.5px solid var(--border2);background:none;color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.done-btn.done{background:var(--accent2);border-color:var(--accent);color:var(--accent)}

/* LAST SESSION RECALL */
.last-session{padding:6px 16px 14px;background:var(--bg3)}
.last-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:600}
.last-sets{display:flex;gap:6px;flex-wrap:wrap}
.last-set-pill{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:6px;padding:4px 9px;border:.5px solid var(--border)}

/* PROGRESS */
.prog-area{padding:0 16px 16px;border-top:.5px solid var(--border);background:var(--bg3)}
.prog-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding-top:12px;margin-bottom:10px;font-weight:600}
.prog-cols{display:flex;gap:5px;align-items:flex-end;height:60px}
.prog-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.prog-bar-wrap{flex:1;width:100%;background:var(--bg5);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end}
.prog-bar{width:100%;border-radius:4px;transition:height .4s}
.prog-wk{font-size:8px;color:var(--text3);text-align:center}
.prog-val{font-size:8px;color:var(--text2);text-align:center}

/* OVERVIEW */
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.ov-card{background:var(--bg3);border-radius:var(--radius-sm);border:.5px solid var(--border);padding:14px}
.ov-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.ov-val{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ov-unit{font-size:10px;color:var(--text3);margin-top:2px}
.pr-list{background:var(--bg3);border-radius:var(--radius);border:.5px solid var(--border);overflow:hidden;margin:0 16px 16px}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:.5px solid var(--border)}
.pr-row:last-child{border-bottom:none}
.pr-name{font-size:13px;color:var(--text2)}
.pr-val{font-size:16px;font-weight:700}
.section-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:14px 16px 8px;font-weight:600}
</style>
</head>
<body>
<div class="app-header">
  <div><h1 id="hTitle">Training</h1><div class="header-sub" id="hSub"></div></div>
  <div id="hBadge" class="phase-badge"></div>
</div>
<div class="page-body" id="pageBody">
  <div id="page-training">
    <div class="sess-tabs" id="sessTabs"></div>
    <div class="phase-bar" id="phaseBar"></div>
    <div id="exList"></div>
  </div>
  <div id="page-overview" style="display:none"><div id="ovContent"></div></div>
</div>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-t" onclick="switchPage('training',this)"><div class="nav-icon-wrap"><span class="nav-icon">◈</span></div>Training</button>
  <button class="nav-btn" id="nav-o" onclick="switchPage('overview',this)"><div class="nav-icon-wrap"><span class="nav-icon">◎</span></div>Overview</button>
</nav>
<script>
// ── UTILS ──────────────────────────────────────────
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb}catch(e){return fb}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ── PROGRAM ────────────────────────────────────────
const PHASES=[
  {label:'Heavy',  color:'var(--red)',   bg:'var(--red2)'},
  {label:'Moderate',color:'var(--amber)',bg:'var(--amber2)'},
  {label:'Light',  color:'var(--accent)',bg:'var(--accent2)'},
];

const PLAN=[
  {id:'upper1',title:'Upper 1',day:'Mon / Thu',barCol:'#60a8f0',tabActive:'active-u1',
   exercises:[
    {id:'macFly',   name:'Machine Fly',            sets:3,reps:['6–8','8–12','12–20']},
    {id:'incSm',    name:'30° Incline Smith Press', sets:2,reps:['5–7','8–12','12–15']},
    {id:'btnSm',    name:'BTN Smith Press',         sets:3,reps:['4–6','6–10','10–15']},
    {id:'wideLpd',  name:'Wide Grip Lat Pulldown',  sets:3,reps:['6–8','8–12','12–20']},
    {id:'tbar',     name:'T-Bar Row',               sets:2,reps:['5–7','8–12','12–15']},
    {id:'rearDelt', name:'Rear Delt Fly',           sets:3,reps:['6–8','8–12','12–20']},
  ]},
  {id:'legs',title:'Legs',day:'Tue / Fri',barCol:'#60e8d8',tabActive:'active-legs',
   exercises:[
    {id:'squat',    name:'Hack / V-Squat',          sets:2,reps:['3–5','5–8','8–12']},
    {id:'legExt',   name:'Leg Extension',           sets:2,reps:['8–10','10–15','15–25']},
    {id:'preachHam',name:'Preacher / Alt DB Hammer',sets:3,reps:['6–8','8–12','12–20'],rotate:true},
    {id:'hamCurl',  name:'Ham Curl',                sets:3,reps:['6–8','8–12','12–20']},
    {id:'adduct',   name:'Adductor',                sets:1,reps:['8–12','10–15','12–20']},
    {id:'abCable',  name:'AB Cable Crunch',         sets:2,reps:['8–10','10–15','15–20']},
    {id:'hangLeg',  name:'Hanging Str Leg Raise',   sets:2,reps:['8–10','10–15','15–20']},
  ]},
  {id:'upper2',title:'Upper 2',day:'Wed / Sat',barCol:'#f0b860',tabActive:'active-u2',
   exercises:[
    {id:'convPrs',   name:'Conv Chest Press',       sets:3,reps:['5–7','8–12','12–15']},
    {id:'loFly',     name:'Lo-Z-H Fly',             sets:2,reps:['8–10','10–15','15–25']},
    {id:'machOhp',   name:'Machine OHP',            sets:3,reps:['4–6','6–10','10–15']},
    {id:'slaLpd',    name:'SLA Lat Pulldown',       sets:2,reps:['6–8','8–12','12–20']},
    {id:'machRowOh', name:'Machine Row OH',         sets:3,reps:['6–8','8–12','12–20']},
    {id:'dbLatRaise',name:'DB Lateral Raise',       sets:3,reps:['8–10','10–15','15–25']},
  ]},
];

// ── DATA ───────────────────────────────────────────
// Session log: array of {sessId, phase(0/1/2), date, sets:{exId:{si:{weight,reps,done}}}}
let LOG=lsGet('fitLog',[]);

// Migrate old lift data if LOG is empty
(function migrate(){
  if(LOG.length>0)return;
  const old=lsGet('fitLifts2',null)||lsGet('fitLifts',null)||lsGet('liftV3',null)||lsGet('liftV2',null);
  if(!old)return;
  // Convert each week key's sessions into log entries
  Object.keys(old).sort().forEach(wk=>{
    const wkData=old[wk];
    ['upper1','legs','upper2'].forEach((sid,si)=>{
      const sessData=wkData[sid];
      if(!sessData)return;
      // Check if any sets have data
      const hasData=Object.values(sessData).some(ex=>Object.values(ex).some(s=>s.weight||s.reps));
      if(!hasData)return;
      // Determine phase from week offset
      const start=new Date(2026,3,28);
      const[y,m,d]=wk.split('-').map(Number);
      const cur=new Date(y,m-1,d);
      const weeks=Math.max(0,Math.round((cur-start)/(7*86400000)));
      LOG.push({sessId:sid,phase:weeks%3,date:wk,sets:sessData});
    });
  });
  lsSet('fitLog',LOG);
})();

function saveLog(){lsSet('fitLog',LOG);}

// Current session state
let curSessIdx=lsGet('curSessIdx',0); // 0=upper1,1=legs,2=upper2
let curPhase=lsGet('curPhase',0);     // 0=heavy,1=moderate,2=light
let curSets=lsGet('curSets',{});      // {exId:{si:{weight,reps,done}}}
let openEx=lsGet('openEx',{});

function getLastSession(sessId){
  // Find most recent log entry for this session
  for(let i=LOG.length-1;i>=0;i--){if(LOG[i].sessId===sessId)return LOG[i];}
  return null;
}
function getAllSessions(sessId){return LOG.filter(l=>l.sessId===sessId);}
function getBestWeight(sessId,exId,nSets){
  let best=0;
  LOG.filter(l=>l.sessId===sessId).forEach(log=>{
    if(!log.sets[exId])return;
    for(let i=0;i<nSets;i++){const s=log.sets[exId][i];if(s&&parseFloat(s.weight)>best)best=parseFloat(s.weight);}
  });
  return best||null;
}

// ── STATE ──────────────────────────────────────────
let curPage='training';

// ── NAV ────────────────────────────────────────────
function switchPage(id,btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-training').style.display=id==='training'?'block':'none';
  document.getElementById('page-overview').style.display=id==='overview'?'block':'none';
  document.getElementById('pageBody').scrollTop=0;
  curPage=id;
  if(id==='training')renderTraining();
  if(id==='overview')renderOverview();
}

// ── TRAINING ───────────────────────────────────────
function renderTraining(){
  const sess=PLAN[curSessIdx];
  const ph=PHASES[curPhase];

  document.getElementById('hTitle').textContent=sess.title;
  document.getElementById('hSub').textContent=sess.day+' · Session '+(curSessIdx+1)+' of 3';
  const hb=document.getElementById('hBadge');
  hb.textContent=ph.label;
  hb.style.cssText='font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.04em;background:'+ph.bg+';color:'+ph.color;

  // Session tabs
  document.getElementById('sessTabs').innerHTML=PLAN.map((s,i)=>`
    <button class="sess-tab${i===curSessIdx?' '+s.tabActive:''}" onclick="setSess(${i})">${s.title}</button>
  `).join('');

  // Phase bar
  document.getElementById('phaseBar').innerHTML=PHASES.map((p,i)=>`
    <div class="phase-seg${i===curPhase?' active':''}" style="background:${p.color}"></div>
  `).join('');

  // Exercise list
  const lastLog=getLastSession(sess.id);
  document.getElementById('exList').innerHTML=sess.exercises.map((ex,ei)=>{
    const key=sess.id+'_'+ex.id;
    const isOpen=!!openEx[key];
    const rr=ex.reps[curPhase];
    const curSetData=curSets[ex.id]||{};
    // Build summary from current sets
    const sumParts=[];
    for(let i=0;i<ex.sets;i++){const s=curSetData[i];if(s&&(s.weight||s.reps))sumParts.push((s.weight||'?')+'×'+(s.reps||'?'));}
    const summary=sumParts.length?sumParts.join('  '):null;

    // Last session recall
    const lastSets=lastLog&&lastLog.sets[ex.id]?lastLog.sets[ex.id]:{};
    const lastPills=[];
    for(let i=0;i<ex.sets;i++){const s=lastSets[i];if(s&&(s.weight||s.reps))lastPills.push((s.weight||'?')+'×'+(s.reps||'?'));}

    // Progress: last 6 sessions for this exercise
    const allLogs=getAllSessions(sess.id).slice(-6);
    const progW=allLogs.map(log=>{
      let best=0;if(!log.sets[ex.id])return null;
      for(let i=0;i<ex.sets;i++){const s=log.sets[ex.id][i];if(s&&parseFloat(s.weight)>best)best=parseFloat(s.weight);}
      return best||null;
    });
    const maxP=Math.max(...progW.filter(v=>v!=null),1);
    const progHtml=allLogs.map((log,wi)=>{
      const w=progW[wi];const pct=w?Math.round((w/maxP)*100):0;
      const phaseColor=PHASES[log.phase]?PHASES[log.phase].color:'#3a3a40';
      return `<div class="prog-col"><div class="prog-bar-wrap"><div class="prog-bar" style="height:${pct}%;background:${phaseColor}"></div></div><div class="prog-wk">${PHASES[log.phase]?PHASES[log.phase].label.slice(0,1):'?'}</div><div class="prog-val">${w?w+'lb':''}</div></div>`;
    }).join('');

    const setHtml=Array.from({length:ex.sets},(_,si)=>{
      const s=curSetData[si]||{weight:'',reps:'',done:false};
      const lastS=lastSets[si];
      const pholder_w=lastS&&lastS.weight?'prev: '+lastS.weight:'lb';
      const pholder_r=lastS&&lastS.reps?'prev: '+lastS.reps:'reps';
      return `<div class="set-row">
        <div class="set-num">${si+1}</div>
        <input class="set-inp${s.weight?' has-val':''}" type="number" inputmode="decimal" step="2.5" placeholder="${pholder_w}" value="${s.weight||''}" onchange="updSet('${ex.id}',${si},'weight',this.value,this,'${key}',${ex.sets})">
        <input class="set-inp${s.reps?' has-val':''}" type="number" inputmode="numeric" placeholder="${pholder_r}" value="${s.reps||''}" onchange="updSet('${ex.id}',${si},'reps',this.value,this,'${key}',${ex.sets})">
        <button class="done-btn${s.done?' done':''}" onclick="togDone('${ex.id}',${si},this)">✓</button>
      </div>`;
    }).join('');

    return `<div class="ex-block" id="exb-${key}">
      <div class="ex-header" onclick="togEx('${key}')">
        <div class="ex-left">
          <span class="ex-num">${String(ei+1).padStart(2,'0')}</span>
          <div>
            <div class="ex-name">${ex.name}</div>
            ${ex.rotate?'<div class="ex-note">Rotate each leg day</div>':''}
            <div class="ex-target">${rr} · ${ex.sets} sets</div>
            ${summary?`<div class="ex-summary">${summary}</div>`:''}
          </div>
        </div>
        <span class="ex-chev" id="ec-${key}" style="transform:${isOpen?'rotate(90deg)':''}">›</span>
      </div>
      ${lastPills.length?`<div class="last-session" id="ls-${key}"><div class="last-label">Last session</div><div class="last-sets">${lastPills.map(p=>`<span class="last-set-pill">${p}</span>`).join('')}</div></div>`:''}
      <div class="set-area${isOpen?' open':''}" id="sa-${key}">
        <div class="set-col-heads"><span></span><span>weight</span><span>reps</span><span></span></div>
        ${setHtml}
      </div>
      ${progHtml?`<div id="prog-${key}" style="${isOpen?'':'display:none'}"><div class="prog-area"><div class="prog-label">Progress (H=Heavy M=Moderate L=Light)</div><div class="prog-cols">${progHtml}</div></div></div>`:''}
    </div>`;
  }).join('');
}

function setSess(i){
  // Tab switching just views — does NOT save or advance phase
  curSessIdx=i;
  lsSet('curSessIdx',curSessIdx);
  curSets=lsGet('curSets_'+i,{});
  openEx={};lsSet('openEx',{});
  renderTraining();
  setTimeout(renderFinishBtn,0);
}

function advanceSession(){
  saveCurrentSession();
  curSessIdx=(curSessIdx+1)%3;
  if(curSessIdx===0){curPhase=(curPhase+1)%3;lsSet('curPhase',curPhase);}
  lsSet('curSessIdx',curSessIdx);
  curSets={};lsSet('curSets',{});
  openEx={};lsSet('openEx',{});
  renderTraining();
}

function saveCurrentSession(){
  const sess=PLAN[curSessIdx];
  const hasData=Object.values(curSets).some(ex=>Object.values(ex).some(s=>s.weight||s.reps));
  if(!hasData)return;
  LOG.push({sessId:sess.id,phase:curPhase,date:new Date().toISOString().slice(0,10),sets:JSON.parse(JSON.stringify(curSets))});
  saveLog();
}

function togEx(key){
  openEx[key]=!openEx[key];
  lsSet('openEx',openEx);
  const sa=document.getElementById('sa-'+key),prog=document.getElementById('prog-'+key),ch=document.getElementById('ec-'+key);
  if(sa)sa.classList.toggle('open',openEx[key]);
  if(prog)prog.style.display=openEx[key]?'':'none';
  if(ch)ch.style.transform=openEx[key]?'rotate(90deg)':'';
}

function updSet(eid,si,field,val,inp,key,nSets){
  if(!curSets[eid])curSets[eid]={};
  if(!curSets[eid][si])curSets[eid][si]={weight:'',reps:'',done:false};
  curSets[eid][si][field]=val;
  lsSet('curSets',curSets);
  if(inp)inp.classList.toggle('has-val',val!=='');
  // Update summary
  const sumParts=[];
  for(let i=0;i<nSets;i++){const s=curSets[eid][i];if(s&&(s.weight||s.reps))sumParts.push((s.weight||'?')+'×'+(s.reps||'?'));}
  const sum=sumParts.length?sumParts.join('  '):null;
  const sumEl=document.querySelector('#exb-'+key+' .ex-summary');
  const tEl=document.querySelector('#exb-'+key+' .ex-target');
  if(sum){if(sumEl)sumEl.textContent=sum;else if(tEl){const d=document.createElement('div');d.className='ex-summary';d.textContent=sum;tEl.after(d);}}
}

function togDone(eid,si,btn){
  if(!curSets[eid])curSets[eid]={};
  if(!curSets[eid][si])curSets[eid][si]={weight:'',reps:'',done:false};
  curSets[eid][si].done=!curSets[eid][si].done;
  lsSet('curSets',curSets);
  btn.classList.toggle('done',curSets[eid][si].done);
}

// ── FINISH BUTTON ───────────────────────────────────
// Shown at bottom of exercise list
function renderFinishBtn(){
  const existing=document.getElementById('finishBtn');
  if(existing)existing.remove();
  const btn=document.createElement('button');
  btn.id='finishBtn';
  btn.textContent='Finish & Next Session →';
  btn.style.cssText='display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:16px;background:var(--accent);color:#0e0e0f;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:-.01em';
  btn.onclick=advanceSession;
  document.getElementById('exList').appendChild(btn);
}

// ── OVERVIEW ───────────────────────────────────────
function renderOverview(){
  document.getElementById('hTitle').textContent='Overview';
  document.getElementById('hSub').textContent='All sessions';
  document.getElementById('hBadge').textContent='';
  document.getElementById('hBadge').style.cssText='';

  const totalVol=LOG.reduce((t,log)=>{
    return t+Object.values(log.sets).reduce((tt,ex)=>tt+Object.values(ex).reduce((ttt,s)=>{const w=parseFloat(s.weight),r=parseFloat(s.reps);return ttt+(w>0&&r>0?w*r:0);},0),0);
  },0);

  const sessCount=LOG.length;
  const ph=PHASES[curPhase];

  const statsHtml=`
    <div class="ov-grid">
      <div class="ov-card"><div class="ov-label">Sessions logged</div><div class="ov-val" style="color:var(--accent)">${sessCount}</div><div class="ov-unit">total</div></div>
      <div class="ov-card"><div class="ov-label">Total volume</div><div class="ov-val" style="color:var(--teal)">${totalVol>0?(totalVol/1000).toFixed(1)+'k':'—'}</div><div class="ov-unit">lb lifted</div></div>
      <div class="ov-card"><div class="ov-label">Current phase</div><div class="ov-val" style="color:${ph.color};font-size:16px">${ph.label}</div><div class="ov-unit">week</div></div>
      <div class="ov-card"><div class="ov-label">Next session</div><div class="ov-val" style="font-size:16px;color:var(--blue)">${PLAN[curSessIdx].title}</div><div class="ov-unit">${PLAN[curSessIdx].day}</div></div>
    </div>`;

  // PRs
  const prs=[];
  PLAN.forEach(sess=>{
    sess.exercises.forEach(ex=>{
      const best=getBestWeight(sess.id,ex.id,ex.sets);
      if(best>0)prs.push({name:ex.name,weight:best,color:sess.barCol});
    });
  });

  const prHtml=prs.length?`
    <div class="section-label">Personal records</div>
    <div class="pr-list">${prs.sort((a,b)=>b.weight-a.weight).map(l=>`<div class="pr-row"><div class="pr-name">${l.name}</div><div class="pr-val" style="color:${l.color}">${l.weight} lb</div></div>`).join('')}</div>`:'';

  // Recent sessions
  const recentHtml=LOG.length?`
    <div class="section-label">Recent sessions</div>
    <div class="pr-list">${[...LOG].reverse().slice(0,10).map(log=>{
      const sess=PLAN.find(s=>s.id===log.sessId);
      const vol=Object.values(log.sets).reduce((t,ex)=>t+Object.values(ex).reduce((tt,s)=>{const w=parseFloat(s.weight),r=parseFloat(s.reps);return tt+(w>0&&r>0?w*r:0);},0),0);
      const ph=PHASES[log.phase];
      return `<div class="pr-row"><div><div class="pr-name">${sess?sess.title:'?'} · ${log.date}</div><div style="font-size:10px;color:${ph?ph.color:'var(--text3)'};margin-top:2px">${ph?ph.label:''} phase</div></div><div class="pr-val" style="color:var(--teal);font-size:13px">${vol>0?vol.toLocaleString()+' lb':'—'}</div></div>`;
    }).join('')}</div>`:'';

  document.getElementById('ovContent').innerHTML=statsHtml+prHtml+recentHtml;
}

function init(){
  // Load in-progress sets for current session
  curSets=lsGet('curSets_'+curSessIdx,{});
  renderTraining();
  setTimeout(renderFinishBtn,0);
}

function renderFinishBtn(){
  const existing=document.getElementById('finishBtn');
  if(existing)existing.remove();
  const sess=PLAN[curSessIdx];
  const ph=PHASES[curPhase];
  const nextSessIdx=(curSessIdx+1)%3;
  const nextPhaseIdx=nextSessIdx===0?(curPhase+1)%3:curPhase;
  const nextSess=PLAN[nextSessIdx];
  const nextPh=PHASES[nextPhaseIdx];
  const btn=document.createElement('button');
  btn.id='finishBtn';
  btn.innerHTML=`Finish ${sess.title} &nbsp;→&nbsp; ${nextSess.title} <span style="font-size:11px;opacity:.7">(${nextPh.label})</span>`;
  btn.style.cssText='display:block;width:calc(100% - 32px);margin:12px 16px 4px;padding:16px;background:var(--accent);color:#0e0e0f;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.01em';
  btn.onclick=advanceSession;
  document.getElementById('exList').appendChild(btn);
}
</script>
</body>
